<!DOCTYPE html>
<html>

<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
        <tr>
            <td align="center">
                <table width="100%" cellpadding="0" cellspacing="0"
                    style="max-width:600px;background:#ffffff;border-radius:16px;overflow:hidden;">

                    <tr>
                        <td style="background:#111111;padding:28px;text-align:center;">
                            <div style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:3px;">
                                1200 HAIRSTUDIO
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:40px;">
                            <h1 style="margin:0 0 16px;font-size:28px;color:#111111;">
                                Appointment confirmed
                            </h1>

                            <p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#555555;">
                                Hi ${customerName}, your appointment has been successfully booked.
                            </p>

                            <table width="100%" cellpadding="0" cellspacing="0"
                                style="background:#f7f7f7;border-radius:12px;padding:24px;">
                                <tr>
                                    <td style="padding:8px 0;color:#777;">Service</td>
                                    <td align="right" style="padding:8px 0;font-weight:600;">
                                        ${serviceName}
                                    </td>
                                </tr>

                                <tr>
                                    <td style="padding:8px 0;color:#777;">Date</td>
                                    <td align="right" style="padding:8px 0;font-weight:600;">
                                        ${date}
                                    </td>
                                </tr>

                                <tr>
                                    <td style="padding:8px 0;color:#777;">Time</td>
                                    <td align="right" style="padding:8px 0;font-weight:600;">
                                        ${time}
                                    </td>
                                </tr>

                                <tr>
                                    <td style="padding:8px 0;color:#777;">Price</td>
                                    <td align="right" style="padding:8px 0;font-weight:600;">
                                        CHF ${price}
                                    </td>
                                </tr>
                            </table>

                            <div style="text-align:center;margin-top:32px;">
                                <a href="${manageUrl}" style="
                      display:inline-block;
                      background:#111111;
                      color:#ffffff;
                      text-decoration:none;
                      padding:14px 28px;
                      border-radius:8px;
                      font-weight:600;
                    ">
                                    Manage Appointment
                                </a>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td style="
                padding:24px 40px;
                background:#fafafa;
                text-align:center;
                font-size:13px;
                color:#888888;
              ">
                            1200 Hairstudio · Salmsach, Switzerland
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
